services:
  resourcespace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umbraco-resourcespace-dam
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      RS_BASE_URL: ${RS_BASE_URL:-http://localhost:8085}
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE:-resourcespace}
      MYSQL_USER: ${MYSQL_USER:-resourcespace_rw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rs_local_dev_pw}
    volumes:
      - rs_filestore:/var/www/html/filestore
    ports:
      - "${RS_BIND_IP:-127.0.0.1}:${RS_PORT:-8085}:80"

  mariadb:
    image: mariadb:11.4
    container_name: umbraco-resourcespace-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-resourcespace}
      MARIADB_USER: ${MYSQL_USER:-resourcespace_rw}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-rs_local_dev_pw}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rs_local_root_pw}
    volumes:
      - rs_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  rs_mariadb:
  rs_filestore:
